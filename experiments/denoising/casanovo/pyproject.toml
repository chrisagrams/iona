[project]
name = "casanovo-denoising"
version = "0.1.0"
description = "Frozen Casanovo encoder baseline for peak-level MS/MS denoising."
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "accelerate>=1.0",
    "casanovo==5.2.0",
    "numpy<2",
    "datasets>=3,<5",
    "scikit-learn",
    "torch>=2.2",
    "tqdm",
]

[project.scripts]
casanovo-denoising = "casanovo_denoising.train:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/casanovo_denoising"]
