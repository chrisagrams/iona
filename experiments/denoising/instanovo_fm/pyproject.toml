[project]
name = "instanovo-fm-denoising"
version = "0.1.0"
description = "Frozen InstaNovo-FM encoder baseline for peak-level MS/MS denoising."
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "accelerate>=1.0",
    "instanovo-fm==0.1.0",
    "datasets>=3,<5",
    "scikit-learn",
    "torch>=2.2",
    "tqdm",
]

[project.scripts]
instanovo-fm-denoising = "instanovo_fm_denoising.train:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/instanovo_fm_denoising"]
