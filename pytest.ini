[pytest]
testpaths = tests
addopts = -q --strict-markers --ignore=tests/gpu
markers =
    slow: needs the real checkpoint or the network
    device: needs an XPU; run via pbs/run_tests.pbs
# The frameworks build emits a wall of deprecation warnings from torch.jit at import.
# They are not ours and they bury real output; anything from msdelta itself still shows.
filterwarnings =
    ignore::DeprecationWarning:torch.*
    ignore::DeprecationWarning:transformers.*
    ignore::FutureWarning:torch.*
