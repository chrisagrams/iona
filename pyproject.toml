[project]
name = "iona-ms"
version = "0.1.0"
description = "Mass-spec transformer with learned per-head Δm/z attention bias"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "mscompress>=1.0.16",
    "numpy",
    "scipy",
    "wandb",
    "matplotlib",
    "pyyaml",
    "pyarrow>=24.0.0",
    "pandas>=3.0",
    "pyteomics>=4.7.5",
    "lxml>=5.0",
    "scikit-learn>=1.8.0",
    "huggingface-hub>=1.20.1",
    "datasets>=4.0.0",
    "transformers>=4.46.0",
    "accelerate>=1.0.0",
    "deepspeed>=0.15.0; sys_platform == 'linux'",
    "pytorch-metric-learning>=2.9.0",
    "sentence-transformers>=6.0.0",
    "tqdm",
    "faiss-gpu-cu12>=1.14.1; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version < '3.14'",
    "faiss-cpu>=1.14.1; sys_platform != 'linux' or platform_machine != 'x86_64' or python_version >= '3.14'",
]

[project.optional-dependencies]
cuda = [
    "torch>=2.10,<2.12",
]
xpu = [
    "torch>=2.10,<2.12",
    "triton-xpu",
]

[project.scripts]
iona-train = "iona.train:main"
iona-preprocess = "iona.preprocess:main"
iona-denoise = "iona.denoise_mzml:main"

[dependency-groups]
dev = [
    "pre-commit",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["iona"]

[tool.hatch.build.targets.sdist]
include = ["iona", "tests", "README.md", "MODEL_CARD.md"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "PLC0415", "TID252"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"iona/modeling_iona.py" = ["TID252"]

[tool.uv]
conflicts = [
    [
        { extra = "cuda" },
        { extra = "xpu" },
    ],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", extra = "cuda" },
    { index = "pytorch-xpu", extra = "xpu" },
]
triton-xpu = [
    { index = "pytorch-xpu", extra = "xpu" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-xpu"
url = "https://download.pytorch.org/whl/xpu"
explicit = true
