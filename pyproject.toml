[project]
name = "msdelta"
version = "0.1.0"
description = "Mass-spec transformer with learned per-head Δm/z attention bias"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mscompress>=1.0.16",
    "torch>=2.10,<2.12",
    "numpy",
    "scipy",
    "wandb",
    "matplotlib",
    "pyyaml",
    "pyarrow>=24.0.0",
    "scikit-learn>=1.8.0",
    "huggingface-hub>=1.20.1",
]

[project.scripts]
msdelta-train = "msdelta.train:main"
msdelta-analyze = "msdelta.analyze:main"
msdelta-probe = "msdelta.probe:main"
msdelta-retrieval = "msdelta.retrieval:main"
msdelta-replicate-retrieval = "msdelta.replicate_retrieval:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["msdelta"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
