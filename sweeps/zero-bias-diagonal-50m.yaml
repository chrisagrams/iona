program: msdelta/train.py

project: msdelta-zero-bias-diagonal
name: 50m-10k-paired-seeds

method: grid
run_cap: 10

parameters:
  zero_bias_diagonal:
    values: ["true", "false"]
  seed:
    values: [0, 1, 2, 3, 4]

command:
  - uv
  - run
  - torchrun
  - --standalone
  - --nproc_per_node=2
  - -m
  - msdelta.train
  - --args_file
  - configs/msdelta-base-50m/training.args
  - "--config_overrides=zero_bias_diagonal=${zero_bias_diagonal}"
  - "--seed=${seed}"
  - "--run_name=50m-zbd-${zero_bias_diagonal}-seed-${seed}"
  - "--output_dir=./runs/zero-bias-diagonal/50m-zbd-${zero_bias_diagonal}-seed-${seed}"
  - --wandb_project=msdelta-zero-bias-diagonal
  - --max_steps=10000
  - --warmup_steps=400
  - --eval_steps=500
  - --save_strategy=no
  - --probe_steps=2500
  - --bias_curve_steps=2500
