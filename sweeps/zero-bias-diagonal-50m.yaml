program: msdelta/train.py

project: msdelta-pretrain
name: 50m-10k-paired-seeds

method: grid
run_cap: 10

parameters:
  config_overrides:
    values:
      - zero_bias_diagonal=true
      - zero_bias_diagonal=false
  seed:
    values: [0, 1, 2, 3, 4]

command:
  - uv
  - run
  - torchrun
  - --standalone
  - --nproc_per_node=2
  - -m
  - msdelta.train
  - --args_file
  - configs/msdelta-base-50m/training.args
  - "--run_name=${envvar:WANDB_RUN_ID}"
  - "--output_dir=./runs/zero-bias-diagonal/${envvar:WANDB_RUN_ID}"
  - --wandb_project=msdelta-pretrain
  - --max_steps=10000
  - --warmup_steps=400
  - --eval_steps=500
  - --save_strategy=no
  - --probe_steps=2500
  - --bias_curve_steps=2500
  - ${args}
