program: iona/train.py

project: iona-pretrain
name: 50m-delta-bias-fourier-10k-bayes

method: bayes
metric:
  name: eval/loss
  goal: minimize
run_cap: 30

parameters:
  delta_bias_n_freqs:
    values: [16, 32, 64, 128]
  delta_bias_f_min:
    distribution: log_uniform_values
    min: 0.001
    max: 0.1
  delta_bias_f_max:
    distribution: log_uniform_values
    min: 100.0
    max: 2000.0
  seed:
    value: 0

command:
  - bash
  - -lc
  - >-
    overrides="";
    seed_arg="";
    for arg in "$@"; do
      case "$arg" in
        --delta_bias_*=*)
          overrides="${overrides:+$overrides,}${arg#--}"
          ;;
        --seed=*)
          seed_arg="$arg"
          ;;
      esac;
    done;
    exec uv run torchrun --standalone --nproc_per_node=2 -m iona.train
    --args_file configs/iona-base-50m/training.args
    --run_name="$WANDB_RUN_ID"
    --output_dir="./runs/delta-bias-fourier/$WANDB_RUN_ID"
    --wandb_project=iona-pretrain
    --max_steps=10000
    --warmup_steps=400
    --eval_steps=500
    --save_strategy=no
    --probe_steps=2500
    --bias_curve_steps=2500
    --config_overrides="$overrides"
    "$seed_arg"
  - wandb-sweep
  - ${args}
