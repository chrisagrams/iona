program: msdelta/train.py

project: msdelta-pretrain
name: 50m-delta-bias-n-freqs-256-512-10k-grid

method: grid
metric:
  name: eval/loss
  goal: minimize

parameters:
  delta_bias_n_freqs:
    values: [256, 512]
  delta_bias_f_min:
    value: 0.001
  delta_bias_f_max:
    value: 190.0
  seed:
    values: [0, 1, 2]

command:
  - bash
  - -lc
  - >-
    overrides="";
    seed_arg="";
    for arg in "$@"; do
      case "$arg" in
        --delta_bias_*=*)
          overrides="${overrides:+$overrides,}${arg#--}"
          ;;
        --seed=*)
          seed_arg="$arg"
          ;;
      esac;
    done;
    exec uv run torchrun --standalone --nproc_per_node=2 -m msdelta.train
    --args_file configs/msdelta-base-50m/training.args
    --run_name="$WANDB_RUN_ID"
    --output_dir="./runs/delta-bias-n-freqs/$WANDB_RUN_ID"
    --wandb_project=msdelta-pretrain
    --max_steps=10000
    --warmup_steps=400
    --eval_steps=500
    --save_strategy=no
    --probe_steps=2500
    --bias_curve_steps=2500
    --config_overrides="$overrides"
    "$seed_arg"
  - wandb-sweep
  - ${args}
