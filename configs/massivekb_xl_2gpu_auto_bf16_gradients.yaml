# Two-GPU control run for the DeepSpeed gradient-precision comparison.
#
# Mirrors W&B run massivekb_xl-polaris-gbs512-7449863 as closely as possible,
# while adapting its batch layout from four GPUs to two:
#   64 spectra/GPU x 2 GPUs x 4 accumulation steps = global batch 512.
#
# DeepSpeed gradient accumulation and communication are intentionally left at
# their native-bf16 defaults. Compare only against the matched fp32 config.
d_model: 1024
n_heads: 16
n_layers: 16
ffn_mult: 4
dropout: 0.1
max_peaks: 150
zero_bias_diagonal: true
fourier_int_n_freqs: 16
fourier_int_f_min: 1.0e-2
fourier_int_f_max: 1.0e+2
fourier_int_learnable: true
delta_bias_n_freqs: 64
delta_bias_per_head_hidden: 32
delta_bias_f_min: 1.0e-2
delta_bias_f_max: 1.0e+3
delta_bias_scale: 3.0
delta_bias_learnable: true

hf_repo: chrisagrams/massive_kb_v1_shuffled
hf_train_split: train
hf_val_split: val
n_val_files: 2
intensity_threshold_frac: 0.01
top_n: 150
mask_ratio: 0.50

batch_size: 64
grad_accum_steps: 4
num_workers: 6
lr: 1.3e-4
warmup_steps: 2000
total_steps: 90000
lr_scheduler_type: cosine
weight_decay: 0.01
grad_clip: 1.0
precision: bf16
compile: true
val_batches: 50
device: cuda
seed: 0
deepspeed: true
zero_stage: 2
deepspeed_fp32_gradients: false

wandb_project: msfound
wandb_run_name: massivekb_xl-2gpu-gbs512-auto-bf16grads
log_every: 50
val_every: 2000
bias_curve_every: 5000
ckpt_every: 10000
probe_every: 5000
probe_n_spectra: 3000
replicate_retrieval_repo: chrisagrams/ms2-peptide-replicate-retrieval
out_dir: ./runs
