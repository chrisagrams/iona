# Two-GPU ZeRO-2 test using PyTorch bf16 autocast instead of DeepSpeed-native
# bf16. This preserves ZeRO-2 gradient/optimizer sharding while keeping live
# model parameters in fp32, matching the healthy non-DeepSpeed precision path.
#
# Apart from the precision mechanism and run name, this matches
# massivekb_xl_2gpu_auto_bf16_gradients.yaml:
#   64 spectra/GPU x 2 GPUs x 4 accumulation steps = global batch 512.
d_model: 1024
n_heads: 16
n_layers: 16
ffn_mult: 4
dropout: 0.1
max_peaks: 150
zero_bias_diagonal: true
fourier_int_n_freqs: 16
fourier_int_f_min: 1.0e-2
fourier_int_f_max: 1.0e+2
fourier_int_learnable: true
delta_bias_hidden: 128
delta_bias_resolution: 0.01
delta_bias_max_distance: 2000.0
delta_bias_coordinate_scale: 1.0
delta_bias_scale: 3.0

hf_repo: chrisagrams/massive_kb_v1_shuffled
hf_train_split: train
hf_val_split: val
n_val_files: 2
intensity_threshold_frac: 0.01
top_n: 150
mask_ratio: 0.50

batch_size: 64
grad_accum_steps: 4
num_workers: 6
lr: 1.3e-4
warmup_steps: 2000
total_steps: 90000
lr_scheduler_type: cosine
weight_decay: 0.01
grad_clip: 1.0
precision: bf16
compile: true
val_batches: 50
device: cuda
seed: 0
deepspeed: true
zero_stage: 2
deepspeed_fp32_gradients: false
deepspeed_torch_autocast: true

wandb_project: msfound
wandb_run_name: massivekb_xl-2gpu-gbs512-zero2-torch-autocast
log_every: 50
val_every: 2000
bias_curve_every: 5000
ckpt_every: 10000
probe_n_spectra: 3000
replicate_retrieval_repo: chrisagrams/ms2-peptide-replicate-retrieval
out_dir: ./runs
