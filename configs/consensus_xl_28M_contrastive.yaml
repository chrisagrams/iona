# Contrastive POST-TRAINING on the CONSENSUS corpus (MassIVE-KB-sized 28M
# subset) — XL tier.
#
# Loads a masked-intensity-pretrained XL encoder (train.pretrained_ckpt) and
# fine-tunes it with a supervised-contrastive objective on two augmented views
# per spectrum, so the RAW pooled-embedding cosine geometry becomes
# retrieval-good without eval-time whitening.
#
# This is one of a size+step matched PAIR — the ONLY differences vs
# massivekb_xl_contrastive.yaml are data.root, n_val_files, and the wandb name —
# so a wandb diff isolates the corpus (consensus vs experimental). Both start
# from the SAME pretrained encoder. Launch:
#   qsub -v CFG=configs/consensus_xl_28M_contrastive.yaml pbs/consensus_contrastive_ddp.pbs
#
# Model MUST match the pretrained checkpoint's architecture so the encoder loads.
model:
  d_model: 1024
  n_heads: 16
  n_layers: 16
  ffn_mult: 4
  dropout: 0.1
  max_peaks: 150
  use_precursor: false
  fourier_mz:
    n_freqs: 64
    f_min: 1.0e-2
    f_max: 1.0e+3
  fourier_int:
    n_freqs: 16
    f_min: 1.0e-2
    f_max: 1.0e+2
  delta_bias:
    n_freqs: 64
    per_head_hidden: 32
    f_min: 1.0e-2
    f_max: 1.0e+3
    scale: 3.0
    charge_dim: 0
    n_charges: 8

data:
  # MassIVE-KB-sized shuffled consensus (TARGET_TRAIN=28508636 in shuffle_consensus.sh).
  root: /eagle/UIC-HPC/cgrams/msbench-datasets/consensus_match_shuffled_28M/
  n_val_files: 4
  intensity_threshold_frac: 0.01
  top_n: 150
  mask:
    mask_ratio: 0.50        # only used when contrastive.lambda_kl > 0

train:
  # Point this at the masked-pretrain checkpoint to fine-tune from (SAME encoder
  # as the massivekb arm).
  pretrained_ckpt: /eagle/UIC-HPC/cgrams/msdelta-runs/<pretrain_run>/final.pt
  batch_size: 80
  num_workers: 6
  lr: 2.0e-5
  warmup_steps: 500
  total_steps: 30000        # 320 spectra/step × 30k = 9.6M ≈ 0.34 epoch of ~28.5M
  weight_decay: 0.01
  grad_clip: 1.0
  precision: bf16
  compile: false
  val_batches: 50
  device: cuda
  seed: 0

contrastive:
  mode: supcon              # supcon | infonce  (infonce = NT-Xent, twin-only positive)
  temperature: 0.07
  proj_dim: 256
  proj_hidden: 2048
  lambda_kl: 0.1            # 0 disables the aux masked-intensity KL (cleanest comparison)
  augmentation:
    peak_dropout_prob: 0.2
    intensity_jitter_sigma: 0.2
    subsample_min_frac: 0.6
    mz_jitter_da: 0.0

log:
  wandb_project: msdelta-contrastive
  wandb_run_name: consensus_xl_28M_contrastive
  log_every: 50
  val_every: 2000
  bias_curve_every: 5000
  ckpt_every: 5000
  probe_every: 2000
  probe_n_spectra: 3000
  replicate_retrieval_repo: chrisagrams/ms2-peptide-replicate-retrieval
  out_dir: /eagle/UIC-HPC/cgrams/msdelta-runs
