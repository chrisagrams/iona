# MassIVE-KB v1 — ~100M parameters on 2× A100-40GB.
#
# Architecture: d=768, 14 layers, and 12 heads gives 99,851,025 parameters
# with the current pretraining head. d_head=64 matches the proven XL attention
# geometry while reducing both width and depth.
#
# Exposure: 64 spectra/GPU × 2 GPUs × 4 accumulation = global batch 512.
# Using the established ~28.8M train-spectrum estimate, 56,250 optimizer steps
# is one epoch, so 112,500 steps trains for two full epochs.
#
# Launch with the same two-rank torchrun setup as massivekb_xl.yaml, changing
# only the config path to configs/massivekb_100M.yaml.
d_model: 768
n_heads: 12
n_layers: 14
ffn_mult: 4
dropout: 0.1
max_peaks: 1024
zero_bias_diagonal: true
fourier_int_n_freqs: 16
fourier_int_f_min: 1.0e-2
fourier_int_f_max: 1.0e+2
fourier_int_learnable: true
delta_bias_hidden: 128
delta_bias_resolution: 0.01
delta_bias_max_distance: 2000.0
delta_bias_coordinate_scale: 1.0
delta_bias_scale: 3.0

hf_repo: chrisagrams/massive_kb_v1_shuffled
hf_train_split: train
hf_val_split: val
intensity_threshold_frac: 0.01
top_n: 1024
mask_ratio: 0.50
preprocess_num_workers: 24

batch_size: 64           # per-GPU micro-batch
grad_accum_steps: 4      # global batch = 64 × 2 GPUs × 4 accum = 512
num_workers: 6           # ×2 ranks = 12 loader workers
lr: 1.8e-4
lr_scheduler_type: cosine
warmup_steps: 2000
total_steps: 112500      # 112500 × 512 = 57.6M spectra ≈ 2 epochs
weight_decay: 0.01
grad_clip: 1.0
precision: bf16
compile: true
val_batches: 50
device: cuda
seed: 0
save_total_limit: 3
deepspeed: true
zero_stage: 2
deepspeed_torch_autocast: true

wandb_project: msfound
wandb_run_name: massivekb_100M-gbs512-2ep
log_every: 50
val_every: 2000
bias_curve_every: 5000
ckpt_every: 10000
probe_n_spectra: 3000
replicate_retrieval_repo: chrisagrams/ms2-peptide-replicate-retrieval
out_dir: ./runs
