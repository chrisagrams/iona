# v14 capacity sweep ON KL LOSS — tier L (d=768). See EXPERIMENTS.md §v14.
# KL loss + mask_ratio=0.50; equal data exposure (~12.8M spectra); baseline
# arch (charge/precursor OFF). bs=112; 114000 steps x 112 = 12.77M. Only
# capacity differs across v14_cap_{S,M,L,XL}.
model:
  d_model: 768
  n_heads: 16
  n_layers: 12
  ffn_mult: 4
  dropout: 0.1
  max_peaks: 150
  use_precursor: false
  fourier_mz:
    n_freqs: 64
    f_min: 1.0e-2
    f_max: 1.0e+3
  fourier_int:
    n_freqs: 16
    f_min: 1.0e-2
    f_max: 1.0e+2
  delta_bias:
    n_freqs: 64
    per_head_hidden: 32
    f_min: 1.0e-2
    f_max: 1.0e+3
    scale: 3.0
    charge_dim: 0
    n_charges: 8

data:
  root: /mnt/vault-1/k8/concensus_spec_30M/consensus_100M/
  n_val_files: 2
  intensity_threshold_frac: 0.01
  top_n: 150
  mask:
    mask_ratio: 0.50

train:
  batch_size: 112
  num_workers: 8
  lr: 1.0e-4
  warmup_steps: 2000
  total_steps: 114000     # 114000 x 112 = 12.77M spectra
  weight_decay: 0.01
  grad_clip: 1.0
  precision: bf16
  val_batches: 50
  device: cuda
  l1_lambda: 0.0
  seed: 0

log:
  wandb_project: msdelta-capacity-kl
  wandb_run_name: v14_cap_L
  log_every: 50
  val_every: 2000
  bias_curve_every: 5000
  ckpt_every: 10000
  probe_every: 5000
  probe_n_spectra: 3000
  out_dir: ./runs
