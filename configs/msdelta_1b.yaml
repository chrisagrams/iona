# Train the 1B model on two A100 GPUs. The global batch size is 512.
model:
  hidden_size: 2048
  num_attention_heads: 16
  num_hidden_layers: 20
  intermediate_size: 8192
  hidden_dropout_prob: 0.1
  attention_probs_dropout_prob: 0.1
  zero_bias_diagonal: true
  fourier_int_n_freqs: 16
  fourier_int_f_min: 1.0e-2
  fourier_int_f_max: 1.0e+2
  fourier_int_learnable: true
  delta_bias_n_freqs: 64
  delta_bias_per_head_hidden: 32
  delta_bias_f_min: 1.0e-2
  delta_bias_f_max: 1.0e+3
  delta_bias_scale: 3.0
  delta_bias_learnable: true

processor:
  intensity_threshold_frac: 0.01
  max_peaks: 150

training:
  output_dir: ./runs/v15-1b-gbs512
  run_name: v15-1b-gbs512
  dataset_repo_id: chrisagrams/massive_kb_v1_shuffled
  dataset_train_split: train
  dataset_validation_split: val
  preprocessing_num_workers: 24
  mask_ratio: 0.50
  per_device_train_batch_size: 64
  per_device_eval_batch_size: 64
  gradient_accumulation_steps: 4
  dataloader_num_workers: 8
  learning_rate: 8.5e-5
  adam_beta1: 0.9
  adam_beta2: 0.95
  lr_scheduler_type: cosine
  warmup_steps: 3000
  max_steps: 56250
  weight_decay: 0.01
  max_grad_norm: 1.0
  bf16: true
  torch_compile: true
  validation_batches: 50
  seed: 0
  logging_steps: 50
  logging_first_step: true
  eval_strategy: steps
  eval_steps: 2000
  save_strategy: steps
  save_steps: 10000
  save_total_limit: 3
  remove_unused_columns: false
  report_to: [wandb]
  wandb_project: msdelta-pretrain
  bias_curve_steps: 5000
  probe_steps: 5000
  probe_num_spectra: 3000
  replicate_retrieval_repo: chrisagrams/ms2-peptide-replicate-retrieval
  deepspeed:
    zero_optimization:
      stage: 2
      overlap_comm: true
      contiguous_gradients: true
    gradient_clipping: auto
    gradient_accumulation_steps: auto
    train_micro_batch_size_per_gpu: auto
    train_batch_size: auto
    torch_autocast:
      enabled: true
      dtype: bfloat16
