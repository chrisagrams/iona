# Toy config for smoke-testing the full training loop end-to-end.
model:
  d_model: 64
  n_heads: 4
  n_layers: 2
  ffn_mult: 2
  dropout: 0.1
  max_peaks: 150
  fourier_mz:
    n_freqs: 16
    f_min: 1.0e-2
    f_max: 1.0e+3
  fourier_int:
    n_freqs: 8
    f_min: 1.0e-2
    f_max: 1.0e+2
  delta_bias:
    n_freqs: 16
    per_head_hidden: 8
    f_min: 1.0e-2
    f_max: 1.0e+3
    scale: 3.0
    charge_dim: 16
    n_charges: 8

data:
  root: /mnt/vault-1/k8/concensus_spec_30M/consensus_100M/
  n_val_files: 1
  intensity_threshold_frac: 0.01
  top_n: 150
  mask:
    mask_ratio: 0.15

train:
  batch_size: 8
  num_workers: 0
  lr: 1.0e-4
  warmup_steps: 10
  total_steps: 100
  weight_decay: 0.01
  grad_clip: 1.0
  precision: bf16
  val_batches: 5
  device: cuda
  l1_lambda: 0.1           # nonzero so the smoke test exercises the L1 path

log:
  wandb_project: msdelta-mzfree-smoke
  wandb_run_name: toy-100steps
  log_every: 10
  val_every: 50
  bias_curve_every: 50
  ckpt_every: 1000
  probe_every: 50          # exercise the inline probe path in the smoke test
  probe_n_spectra: 500
  out_dir: ./runs
