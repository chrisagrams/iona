# v10b: charge-conditioned bias + precursor anchor TOGETHER.
# Tests whether the two spectrum-level m/z constraints stack on fragment_mz_r2.
# Head-to-head (n=6000): v9 0.855, charge 0.872, precursor 0.861 — do both → >0.872?
# Identical to pretrain_small.yaml except charge_dim:16 (vs 0) and run name.
model:
  d_model: 256
  n_heads: 8
  n_layers: 6
  ffn_mult: 4
  dropout: 0.1
  max_peaks: 150
  use_precursor: true       # precursor anchor token (absolute m/z + charge)
  fourier_mz:
    n_freqs: 64
    f_min: 1.0e-2
    f_max: 1.0e+3
  fourier_int:
    n_freqs: 16
    f_min: 1.0e-2
    f_max: 1.0e+2
  delta_bias:
    n_freqs: 64
    per_head_hidden: 32
    f_min: 1.0e-2
    f_max: 1.0e+3
    scale: 3.0
    charge_dim: 16          # charge-conditioned bias (combined with precursor anchor)
    n_charges: 8

data:
  root: /mnt/vault-1/k8/concensus_spec_30M/consensus_100M/
  n_val_files: 2
  intensity_threshold_frac: 0.01
  top_n: 150
  mask:
    mask_ratio: 0.15

train:
  batch_size: 256
  num_workers: 8
  lr: 1.0e-4
  warmup_steps: 2000
  total_steps: 50000
  weight_decay: 0.01
  grad_clip: 1.0
  precision: bf16
  val_batches: 50
  device: cuda
  l1_lambda: 0.0

log:
  wandb_project: msdelta-mzfree
  wandb_run_name: v10_both
  log_every: 50
  val_every: 1000
  bias_curve_every: 2000
  ckpt_every: 5000
  probe_every: 5000
  probe_n_spectra: 3000
  out_dir: ./runs
