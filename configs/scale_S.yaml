# Capacity-sweep tier S  (one per A100-40GB; run all 4 in parallel).
# Equal data exposure: 50000 steps x batch 256 = ~12.8M spectra (~0.12 epoch).
# Baseline architecture (m/z-free + per-head bias + masked-intensity); charge/precursor
# OFF to isolate the effect of capacity on head specialization. ~24 GB est. peak.
# Launch: CUDA_VISIBLE_DEVICES=<gpu> msdelta-train --config configs/scale_S.yaml
model:
  d_model: 384
  n_heads: 8
  n_layers: 8
  ffn_mult: 4
  dropout: 0.1
  max_peaks: 150
  use_precursor: false
  fourier_mz:
    n_freqs: 64
    f_min: 1.0e-2
    f_max: 1.0e+3
  fourier_int:
    n_freqs: 16
    f_min: 1.0e-2
    f_max: 1.0e+2
  delta_bias:
    n_freqs: 64
    per_head_hidden: 32
    f_min: 1.0e-2
    f_max: 1.0e+3
    scale: 3.0
    charge_dim: 0
    n_charges: 8

data:
  root: /mnt/vault-1/k8/concensus_spec_30M/consensus_100M/
  n_val_files: 2
  intensity_threshold_frac: 0.01
  top_n: 150
  mask:
    mask_ratio: 0.15

train:
  batch_size: 256
  num_workers: 8
  lr: 1.0e-4
  warmup_steps: 2000
  total_steps: 50000
  weight_decay: 0.01
  grad_clip: 1.0
  precision: bf16
  val_batches: 50
  device: cuda
  l1_lambda: 0.0
  seed: 0

log:
  wandb_project: msdelta-scale
  wandb_run_name: scale_S
  log_every: 50
  val_every: 2000
  bias_curve_every: 5000
  ckpt_every: 10000
  probe_every: 10000
  probe_n_spectra: 3000
  out_dir: ./runs
