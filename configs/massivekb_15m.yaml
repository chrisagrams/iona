# MassIVE-KB v15 — 15M tier (d=384, n_layers=8, n_heads=8), single GPU.
# Mirrors wandb run massivekb-v15-t5-15m-k1024
# (https://wandb.ai/CS_Pharm/msfound/runs/v1vq9jwf) — a small/fast model
# trained with top_n=1024 peaks kept per spectrum (vs. 150 on the XL configs).
d_model: 384
n_heads: 8
n_layers: 8
ffn_mult: 4
dropout: 0.1
max_peaks: 1024
zero_bias_diagonal: true
fourier_int_n_freqs: 16
fourier_int_f_min: 1.0e-2
fourier_int_f_max: 1.0e+2
fourier_int_learnable: true
delta_bias_hidden: 128
delta_bias_resolution: 0.01
delta_bias_max_distance: 2000.0
delta_bias_coordinate_scale: 1.0
delta_bias_scale: 3.0

hf_repo: chrisagrams/massive_kb_v1_shuffled   # takes precedence over root; train/ + val/ splits
hf_train_split: train
hf_val_split: val
n_val_files: 2
intensity_threshold_frac: 0.01
top_n: 1024
mask_ratio: 0.50
preprocess_num_workers: 24  # rank 0 only; other ranks wait and load its cache

batch_size: 32           # per-device micro-batch
grad_accum_steps: 8      # global batch = 32 × 8 = 256 (single GPU)
num_workers: 6
lr: 2.0e-4
lr_scheduler_type: cosine
warmup_steps: 2000
total_steps: 56250
weight_decay: 0.01
grad_clip: 1.0
precision: bf16
compile: false
val_batches: 50
device: cuda
seed: 0
save_total_limit: 3
deepspeed: false
zero_stage: 2
deepspeed_fp32_gradients: false
deepspeed_torch_autocast: true

wandb_project: msfound
wandb_run_name: massivekb-v15-15m-k1024
log_every: 50
val_every: 2000
bias_curve_every: 5000
ckpt_every: 10000
probe_n_spectra: 3000
replicate_retrieval_repo: chrisagrams/ms2-peptide-replicate-retrieval  # MS2 replicate-retrieval benchmark probe (omit to skip)
out_dir: ./runs
