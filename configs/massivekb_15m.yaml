# Train the 15M model on one GPU. Keep 1024 peaks for each spectrum.
model:
  hidden_size: 384
  num_attention_heads: 8
  num_hidden_layers: 8
  intermediate_size: 1536
  hidden_dropout_prob: 0.1
  attention_probs_dropout_prob: 0.1
  zero_bias_diagonal: true
  fourier_int_n_freqs: 16
  fourier_int_f_min: 1.0e-2
  fourier_int_f_max: 1.0e+2
  fourier_int_learnable: true
  delta_bias_n_freqs: 64
  delta_bias_per_head_hidden: 32
  delta_bias_f_min: 1.0e-2
  delta_bias_f_max: 1.0e+3
  delta_bias_scale: 3.0
  delta_bias_learnable: true

processor:
  intensity_threshold_frac: 0.01
  max_peaks: 1024

training:
  output_dir: ./runs/massivekb-v15-15m-k1024
  run_name: massivekb-v15-15m-k1024
  dataset_repo_id: chrisagrams/massive_kb_v1_shuffled
  dataset_train_split: train
  dataset_validation_split: val
  preprocessing_num_workers: 24
  mask_ratio: 0.50
  per_device_train_batch_size: 32
  per_device_eval_batch_size: 32
  gradient_accumulation_steps: 8
  dataloader_num_workers: 6
  learning_rate: 2.0e-4
  adam_beta1: 0.9
  adam_beta2: 0.95
  lr_scheduler_type: cosine
  warmup_steps: 2000
  max_steps: 56250
  weight_decay: 0.01
  max_grad_norm: 1.0
  bf16: true
  torch_compile: false
  validation_batches: 50
  seed: 0
  logging_steps: 50
  logging_first_step: true
  eval_strategy: steps
  eval_steps: 2000
  save_strategy: steps
  save_steps: 10000
  save_total_limit: 3
  remove_unused_columns: false
  report_to: [wandb]
  wandb_project: msfound
  bias_curve_steps: 5000
  probe_steps: 5000
  probe_num_spectra: 3000
  replicate_retrieval_repo: chrisagrams/ms2-peptide-replicate-retrieval
