# Train the 1B model on two A100 GPUs. The global batch size is 512.
d_model: 2048
n_heads: 16
n_layers: 20
ffn_mult: 4
dropout: 0.1
max_peaks: 1024
zero_bias_diagonal: true
fourier_int_n_freqs: 16
fourier_int_f_min: 1.0e-2
fourier_int_f_max: 1.0e+2
fourier_int_learnable: true
delta_bias_n_freqs: 64
delta_bias_per_head_hidden: 32
delta_bias_f_min: 1.0e-2
delta_bias_f_max: 1.0e+3
delta_bias_scale: 3.0
delta_bias_learnable: true

hf_repo: chrisagrams/massive_kb_v1_shuffled
hf_train_split: train
hf_val_split: val
intensity_threshold_frac: 0.01
top_n: 150
mask_ratio: 0.50
preprocess_num_workers: 24

batch_size: 64
grad_accum_steps: 4
num_workers: 8
lr: 8.5e-5
lr_scheduler_type: cosine
warmup_steps: 3000
total_steps: 56250
weight_decay: 0.01
grad_clip: 1.0
precision: bf16
compile: true
val_batches: 50
device: cuda
seed: 0
save_total_limit: 3
deepspeed: true
zero_stage: 2
deepspeed_torch_autocast: true

wandb_project: msfound
wandb_run_name: v15-1b-gbs512
log_every: 50
val_every: 2000
bias_curve_every: 5000
ckpt_every: 10000
probe_every: 5000
probe_n_spectra: 3000
replicate_retrieval_repo: chrisagrams/ms2-peptide-replicate-retrieval
out_dir: ./runs
