# MassIVE-KB v1 — XL tier (d=1024, ~203M params), 2× A100-40GB data-parallel.
# Same architecture as v14_cap_XL (m/z-free tokens + per-head Δm bias +
# masked-intensity KL loss); the point of this run is to see whether the
# architecture trains cleanly on the Casanovo/GLEAMS MassIVE-KB corpus
# (~28.5M train spectra) with a full global shuffle.
#
# Data is the globally-shuffled MassIVE-KB on the Hugging Face Hub
# (chrisagrams/massive_kb_v1_shuffled) — the same corpus scripts/convert_mgf.py
# would produce locally, but the shuffle is baked in so the raw-MGF loss spikes
# can't recur. hf_split_paths() snapshot-downloads the train/ and val/ shards
# into HF_HOME (set to /eagle/UIC-HPC/cgrams/hf in pbs/massivekb_ddp.pbs).
#
# Exposure: bs=64 per GPU × 2 GPUs × 4 accum = 512 spectra/step, matching W&B
# run qvcw35rr. 28125 steps × 512 = 14.4M ≈ 0.5 epoch of MassIVE-KB train.
# Launch: qsub pbs/massivekb_ddp.pbs
#
# Batch sizing: the gradient-noise-scale probe (scripts/grad_noise_scale.py)
# measures B_simple ≈ 900 on this model at the plateau. The old global 320 was
# ~3x below it — noise-limited, which is why v14 only crept off the plateau and
# a single-GPU global-80 run stalled on it entirely. Global 1024 sits right at
# B_simple — the compute-efficient sweet spot.
d_model: 1024
n_heads: 16
n_layers: 16
ffn_mult: 4
dropout: 0.1
max_peaks: 150
fourier_int_n_freqs: 16
fourier_int_f_min: 1.0e-2
fourier_int_f_max: 1.0e+2
fourier_int_learnable: true
delta_bias_hidden: 128
delta_bias_resolution: 0.01
delta_bias_max_distance: 2000.0
delta_bias_coordinate_scale: 1.0
delta_bias_scale: 3.0

hf_repo: chrisagrams/massive_kb_v1_shuffled   # takes precedence over root; train/ + val/ splits
intensity_threshold_frac: 0.01
top_n: 150
mask_ratio: 0.50
preprocess_num_workers: 24  # rank 0 only; other ranks wait and load its cache

batch_size: 64          # per-GPU; global batch = 64 × 2 GPUs × 4 accum = 512
grad_accum_steps: 4     # → global 512, matching W&B run qvcw35rr
num_workers: 6          # ×2 ranks = 12 loader workers
lr: 1.8e-4              # match W&B run qvcw35rr
warmup_steps: 2000
total_steps: 28125      # 28125 × 512 = 14.4M ≈ 0.5 epoch of MassIVE-KB train
weight_decay: 0.01
grad_clip: 1.0
precision: bf16
compile: true
val_batches: 50
device: cuda
seed: 0
deepspeed: true         # ZeRO-2 (torchrun launch, see pbs/massivekb_ddp.pbs)
zero_stage: 2           # keep ≤2: inline probes call the eager encoder directly
deepspeed_torch_autocast: true  # fp32 params + bf16 compute; native DS bf16 trains poorly here

wandb_project: msfound
wandb_run_name: v17-swinv2-cpb-seq150-bs512   # pbs/massivekb_ddp.pbs appends the job id
log_every: 50
val_every: 2000
bias_curve_every: 5000
ckpt_every: 10000
probe_n_spectra: 3000
replicate_retrieval_repo: chrisagrams/ms2-peptide-replicate-retrieval  # MS2 replicate-retrieval benchmark probe (omit to skip)
out_dir: ./runs
