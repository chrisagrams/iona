# MassIVE-KB v1 — XL tier (d=1024, ~203M params), 4× A100-40GB data-parallel.
# Same architecture as v14_cap_XL (m/z-free tokens + per-head Δm bias +
# masked-intensity KL loss); the point of this run is to see whether the
# architecture trains cleanly on the Casanovo/GLEAMS MassIVE-KB corpus
# (~28.5M train spectra) with a full global shuffle.
#
# Data MUST be the globally-shuffled parquet produced by scripts/convert_mgf.py
# (see pbs/convert_massivekb.sh); the raw MGF is ordered by source raw file
# and would reproduce the old loss spikes. n_val_files=2 takes the two
# `val_*` shards (they sort after `train_*`) as validation.
#
# Exposure: bs=64 per GPU × 4 GPUs × 4 accum = 1024 spectra/step (same global as
# the single-GB10 massivekb_spark run, so the two are directly comparable).
# 28125 steps × 1024 = 28.8M ≈ 1 epoch. Launch: qsub pbs/massivekb_ddp.pbs
#
# Batch sizing: the gradient-noise-scale probe (scripts/grad_noise_scale.py)
# measures B_simple ≈ 900 on this model at the plateau. The old global 320 was
# ~3x below it — noise-limited, which is why v14 only crept off the plateau and
# a single-GPU global-80 run stalled on it entirely. Global 1024 sits right at
# B_simple — the compute-efficient sweet spot.
d_model: 1024
n_heads: 16
n_layers: 16
ffn_mult: 4
dropout: 0.1
max_peaks: 150
fourier_int_n_freqs: 16
fourier_int_f_min: 1.0e-2
fourier_int_f_max: 1.0e+2
fourier_int_learnable: true
delta_bias_n_freqs: 64
delta_bias_per_head_hidden: 32
delta_bias_f_min: 1.0e-2
delta_bias_f_max: 1.0e+3
delta_bias_scale: 3.0
delta_bias_learnable: true

root: /eagle/UIC-HPC/cgrams/msbench-datasets/massive_kb_v1_shared/parquet_shuffled/
n_val_files: 2
intensity_threshold_frac: 0.01
top_n: 150
mask_ratio: 0.50

batch_size: 64          # per-GPU; global batch = 64 × 4 GPUs × 4 accum = 1024
grad_accum_steps: 4     # → global 1024, same as massivekb_spark (at B_simple≈900)
num_workers: 6          # ×4 ranks = 24 loader workers (+4 main) < 32 cores
lr: 1.8e-4              # √-scaled from v14's 1e-4 @ global 320:  1e-4 × √(1024/320) ≈ 1.79e-4
warmup_steps: 2000
total_steps: 28125      # 28125 × 1024 = 28.8M ≈ 1 epoch of MassIVE-KB train
weight_decay: 0.01
grad_clip: 1.0
precision: bf16
compile: true
val_batches: 50
device: cuda
seed: 0
deepspeed: true         # ZeRO-2 (torchrun launch, see pbs/massivekb_ddp.pbs)
zero_stage: 2           # keep ≤2: inline probes call the eager encoder directly

wandb_project: msfound
wandb_run_name: massivekb_xl-polaris-gbs1024   # pbs/massivekb_ddp.pbs appends the job id
log_every: 50
val_every: 2000
bias_curve_every: 5000
ckpt_every: 10000
probe_every: 5000
probe_n_spectra: 3000
out_dir: /eagle/UIC-HPC/cgrams/msdelta-runs
