# Fast reproduction of the compiled evaluation failure. This preserves the
# production XL model, data, batch sizing, precision, and DeepSpeed settings;
# only the run length and evaluation cadence are shortened.
d_model: 1024
n_heads: 16
n_layers: 16
ffn_mult: 4
dropout: 0.1
max_peaks: 150
fourier_int_n_freqs: 16
fourier_int_f_min: 1.0e-2
fourier_int_f_max: 1.0e+2
fourier_int_learnable: true
delta_bias_hidden: 128
delta_bias_resolution: 0.01
delta_bias_max_distance: 2000.0
delta_bias_coordinate_scale: 1.0
delta_bias_scale: 3.0
# Eval-only cumulative score_mod compiler bisection. Stage 4 passed in run
# gutuxobw and stage 5 isolated the failure to dynamically indexing the sliced
# intercept view in fo4aw8tm. Materializing the tables across an eval-only graph
# break passed stage 5; stage 6 adds the slope lookup and linear interpolation.
score_mod_debug_stage: 6

hf_repo: chrisagrams/massive_kb_v1_shuffled
intensity_threshold_frac: 0.01
top_n: 150
mask_ratio: 0.50
preprocess_num_workers: 24

batch_size: 64
grad_accum_steps: 4
num_workers: 6
lr: 1.8e-4
warmup_steps: 2000
total_steps: 6
weight_decay: 0.01
grad_clip: 1.0
precision: bf16
compile: true
val_batches: 50
device: cuda
seed: 0
deepspeed: true
zero_stage: 2
deepspeed_torch_autocast: true

wandb_project: msfound
wandb_run_name: massivekb_xl_debug
log_every: 50
val_every: 2
bias_curve_every: 3
ckpt_every: 5
probe_every: 4
probe_n_spectra: 30
replicate_retrieval_repo: chrisagrams/ms2-peptide-replicate-retrieval
out_dir: ./runs
