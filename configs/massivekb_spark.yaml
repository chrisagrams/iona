# MassIVE-KB v1 — XL tier on the DGX Spark (GB10, single GPU).
# Single-GPU analogue of massivekb_xl.yaml: same architecture, but pulls the
# corpus straight from the Hugging Face dataset (train/ + val/ parquet subdirs)
# instead of a local /eagle path, and drops DeepSpeed/DDP (one GB10 GPU).
#
# Launch: pbs/run_spark_xl.sh configs/massivekb_spark.yaml
#   (hf_repo takes precedence over data.root, so the wrapper's root overlay is
#    ignored; out_dir is still redirected to $REPO/runs by the wrapper.)
d_model: 1024
n_heads: 16
n_layers: 16
ffn_mult: 4
dropout: 0.1
max_peaks: 150
fourier_int_n_freqs: 16
fourier_int_f_min: 1.0e-2
fourier_int_f_max: 1.0e+2
fourier_int_learnable: true
delta_bias_n_buckets: 65536
delta_bias_resolution: 0.001
delta_bias_max_distance: 2000.0

# HF dataset source — precedence over `root`. Layout: train/*.parquet, val/*.parquet.
hf_repo: chrisagrams/massive_kb_v1_shuffled
hf_train_split: train
hf_val_split: val
intensity_threshold_frac: 0.01
top_n: 150
mask_ratio: 0.50

batch_size: 64
grad_accum_steps: 16    # global batch 64 × 16 = 1024 — at the gradient-noise-scale
                        # B_simple≈900 (scripts/grad_noise_scale.py). eff 80 was ~11x below
                        # it, which drowned the low-signal masked-intensity gradient and
                        # stalled training at the predict-uniform plateau.
num_workers: 8
lr: 1.8e-4              # √-scaled from v14's 1e-4 @ global 320:  1e-4 × √(1024/320) ≈ 1.79e-4
warmup_steps: 2000
total_steps: 28125      # 28125 × 1024 = 28.8M ≈ 1 epoch of MassIVE-KB train
weight_decay: 0.01
grad_clip: 1.0
precision: bf16
compile: true
val_batches: 50
device: cuda
seed: 0
deepspeed: false        # single GPU — no torchrun/DDP
zero_stage: 2

wandb_project: msfound
wandb_run_name: massivekb_xl-spark-gbs1024
log_every: 50
val_every: 2000
bias_curve_every: 5000
ckpt_every: 10000
probe_every: 5000
probe_n_spectra: 3000
replicate_retrieval_repo: chrisagrams/ms2-peptide-replicate-retrieval  # MS2 replicate-retrieval benchmark probe (omit to skip)
out_dir: /home/cgrams/msdelta/runs
