# A/B/C/D m/z-pathway screen. Keep every value fixed and override only
# architecture_id/use_absolute_mz/use_delta_mz_bias (commands below).
# A: --architecture_id A --use_absolute_mz false --use_delta_mz_bias false
# B: --architecture_id B --use_absolute_mz true  --use_delta_mz_bias false
# C: --architecture_id C --use_absolute_mz false --use_delta_mz_bias true
# D: --architecture_id D --use_absolute_mz true  --use_delta_mz_bias true
d_model: 1024
n_heads: 16
n_layers: 16
ffn_mult: 4
dropout: 0.1
max_peaks: 1024
fourier_int_n_freqs: 16
fourier_int_f_min: 1.0e-2
fourier_int_f_max: 1.0e+2
fourier_int_learnable: true
fourier_mz_n_freqs: 64
fourier_mz_f_min: 1.0e-3
fourier_mz_f_max: 1.0
fourier_mz_learnable: true
delta_bias_n_freqs: 64
delta_bias_per_head_hidden: 32
delta_bias_f_min: 1.0e-2
delta_bias_f_max: 1.0e+3
delta_bias_scale: 3.0
delta_bias_learnable: true
zero_bias_diagonal: true
architecture_id: C
use_absolute_mz: false
use_delta_mz_bias: true

hf_repo: chrisagrams/massive_kb_v1_shuffled
intensity_threshold_frac: 0.01
top_n: 150
mask_ratio: 0.50
preprocess_num_workers: 24

batch_size: 64          # 64 × 2 GPUs × 4 accumulation = global batch 512
grad_accum_steps: 4
num_workers: 6
lr: 1.8e-4
warmup_steps: 4000      # same warmup exposure as 2,000 steps at global batch 1024
total_steps: 56250      # 56,250 × 512 = 28.8M spectra
lr_scheduler_type: cosine
weight_decay: 0.01
grad_clip: 1.0
precision: bf16
compile: true
val_batches: 50
seed: 0
deepspeed: true
zero_stage: 2
deepspeed_torch_autocast: true

wandb_project: msfound
wandb_run_name: mz-ablation-C1
log_every: 50
val_every: 2000
bias_curve_every: 5000
ckpt_every: 10000
probe_every: 5000
probe_n_spectra: 3000
replicate_retrieval_repo: chrisagrams/ms2-peptide-replicate-retrieval
out_dir: ./runs
