model:
  d_model: 256
  n_heads: 8
  n_layers: 6
  ffn_mult: 4
  dropout: 0.1
  max_peaks: 150
  fourier_mz:
    n_freqs: 64
    f_min: 1.0e-2
    f_max: 1.0e+3
  fourier_int:
    n_freqs: 16
    f_min: 1.0e-2
    f_max: 1.0e+2
  delta_bias:
    n_freqs: 64
    per_head_hidden: 32     # per-head MLP width; total bias capacity = n_heads * per_head_hidden
    f_min: 1.0e-2
    f_max: 1.0e+3
    scale: 3.0              # bias bounded to ±scale logits via scale*tanh(raw/scale)
    charge_dim: 16          # v10: condition bias on precursor charge (0 = off/v9)
    n_charges: 8

data:
  root: /mnt/vault-1/k8/concensus_spec_30M/consensus_100M/
  n_val_files: 2
  intensity_threshold_frac: 0.01
  top_n: 150
  mask:
    mask_ratio: 0.15       # v9: fraction of peaks whose intensity is masked & predicted (m/z never masked)

train:
  batch_size: 256
  num_workers: 8
  lr: 1.0e-4
  warmup_steps: 2000
  total_steps: 50000
  weight_decay: 0.01
  grad_clip: 1.0
  precision: bf16
  val_batches: 50          # how many batches to run for each val pass
  device: cuda
  l1_lambda: 0.0           # L1 sparsity penalty on the bias curve. 0.0 = v7 baseline.
                           # v8 fork probe: try {0.01, 0.1, 1.0}; watch bias_l1 fall vs rmse_mz holding

log:
  wandb_project: msdelta-mzfree
  wandb_run_name: null
  log_every: 50
  val_every: 1000
  bias_curve_every: 2000
  ckpt_every: 5000
  probe_every: 5000        # frozen-encoder linear probe suite (0 = off)
  probe_n_spectra: 3000
  out_dir: ./runs
