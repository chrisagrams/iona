model:
  d_model: 256
  n_heads: 8
  n_layers: 6
  ffn_mult: 4
  dropout: 0.1
  max_peaks: 150
  fourier_mz:
    n_freqs: 64
    f_min: 1.0e-2
    f_max: 1.0e+3
  fourier_int:
    n_freqs: 16
    f_min: 1.0e-2
    f_max: 1.0e+2
  delta_bias:
    n_freqs: 64
    hidden: 128
    f_min: 1.0e-2
    f_max: 1.0e+3

data:
  root: /mnt/vault-1/k8/concensus_spec_30M/consensus_100M/
  n_val_files: 2
  intensity_threshold_frac: 0.01
  top_n: 150
  mask_ratio: 0.15

train:
  batch_size: 256
  num_workers: 8
  lr: 1.0e-4
  warmup_steps: 2000
  total_steps: 50000
  weight_decay: 0.01
  grad_clip: 1.0
  precision: bf16
  loss_int_weight: 1.0
  val_batches: 50          # how many batches to run for each val pass
  device: cuda

log:
  wandb_project: msdelta
  wandb_run_name: null
  log_every: 50
  val_every: 1000
  bias_curve_every: 2000
  ckpt_every: 5000
  out_dir: ./runs
