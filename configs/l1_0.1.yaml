# v8 L1 sparsity probe — medium penalty. See EXPERIMENTS.md §v8.
# Identical to pretrain_small.yaml except: l1_lambda, total_steps (20k, fork is
# readable before 50k), and run name. Run all three, compare bias_l1 vs rmse_mz.
model:
  d_model: 256
  n_heads: 8
  n_layers: 6
  ffn_mult: 4
  dropout: 0.1
  max_peaks: 150
  fourier_mz:
    n_freqs: 64
    f_min: 1.0e-2
    f_max: 1.0e+3
  fourier_int:
    n_freqs: 16
    f_min: 1.0e-2
    f_max: 1.0e+2
  delta_bias:
    n_freqs: 64
    per_head_hidden: 32
    f_min: 1.0e-2
    f_max: 1.0e+3
    scale: 3.0

data:
  root: /mnt/vault-1/k8/concensus_spec_30M/consensus_100M/
  n_val_files: 2
  intensity_threshold_frac: 0.01
  top_n: 150
  denoise:
    gauss_sigma: 0.1

train:
  batch_size: 256
  num_workers: 8
  lr: 1.0e-4
  warmup_steps: 2000
  total_steps: 20000
  weight_decay: 0.01
  grad_clip: 1.0
  precision: bf16
  val_batches: 50
  device: cuda
  l1_lambda: 0.1           # medium — the most likely "interesting" setting

log:
  wandb_project: msdelta-denoise
  wandb_run_name: l1_0.1
  log_every: 50
  val_every: 1000
  bias_curve_every: 2000
  ckpt_every: 5000
  out_dir: ./runs
